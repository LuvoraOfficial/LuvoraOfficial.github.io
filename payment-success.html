<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Payment Verified | Luvora</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: #f1e8db;
      font-family: "DM Sans", Arial, sans-serif;
      color: #270710;
    }

    .card {
      width: 100%;
      max-width: 520px;
      background: #fffaf5;
      border-radius: 28px;
      padding: 42px 28px;
      text-align: center;
      box-shadow: 0 18px 60px rgba(74, 14, 31, 0.12);
    }

    .icon {
      width: 76px;
      height: 76px;
      margin: 0 auto 22px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #4a0e1f;
      color: white;
      font-size: 38px;
    }

    h1 {
      margin: 0 0 12px;
      font-family: Georgia, serif;
      font-size: 32px;
      color: #4a0e1f;
    }

    p {
      margin: 10px 0;
      line-height: 1.6;
    }

    .status {
      margin: 22px 0;
      padding: 14px;
      border-radius: 14px;
      background: #f7eee6;
      font-weight: 600;
    }

    .link-box {
      display: none;
      margin-top: 24px;
      text-align: left;
    }

    .link-box input {
      width: 100%;
      padding: 14px;
      border: 1px solid #dbc9c0;
      border-radius: 12px;
      background: white;
      font-size: 14px;
      outline: none;
    }

    .buttons {
      display: none;
      gap: 10px;
      margin-top: 14px;
      flex-wrap: wrap;
    }

    button,
    .open-btn {
      flex: 1;
      min-width: 130px;
      border: none;
      border-radius: 12px;
      padding: 14px 16px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      text-align: center;
    }

    .primary {
      background: #4a0e1f;
      color: white;
    }

    .secondary {
      background: #ead8d0;
      color: #4a0e1f;
    }

    .whatsapp {
      background: #25d366;
      color: white;
    }

    .error {
      color: #a51d2d;
    }

    .loading {
      color: #6f5360;
    }

    .small {
      font-size: 13px;
      color: #765f68;
      margin-top: 18px;
    }

    @media (max-width: 480px) {
      .card {
        padding: 34px 20px;
      }

      h1 {
        font-size: 28px;
      }
    }
  </style>
<script>
window.SUPABASE_CONFIG = {
  url: "https://yyxcoojwjihimfhnjkhg.supabase.co",
  publishableKey: "sb_publishable_mz1iukZ_LByi-5YK82fhKw_FxcnX1X7"
};
</script>

  
</head>

<body>

  <main class="card">

    <div class="icon" id="icon">♥</div>

    <h1 id="title">Verifying your payment...</h1>

    <p id="message" class="loading">
      Please wait while we securely verify your payment.
    </p>

    <div id="status" class="status">
      Checking payment status...
    </div>

    <div id="linkBox" class="link-box">

      <p><strong>Your Surprise Link</strong></p>

      <input
        type="text"
        id="surpriseLink"
        readonly
      />

      <div class="buttons" id="buttons">

        <button
          class="primary"
          id="copyBtn"
        >
          Copy Link
        </button>

        <button
          class="secondary"
          id="shareBtn"
        >
          Share
        </button>

        <button
          class="whatsapp"
          id="whatsappBtn"
        >
          WhatsApp
        </button>

        <a
          class="open-btn primary"
          id="openBtn"
          target="_blank"
          rel="noopener"
        >
          Open Surprise
        </a>

      </div>

    </div>

    <p class="small" id="smallText">
      Your payment is being securely checked with Cashfree.
    </p>

  </main>


  <script>

    // ---------------------------------------
    // Configuration
    // ---------------------------------------

    const VERIFY_PAYMENT_URL =
      "https://yyxcoojwjihimfhnjkhg.supabase.co/functions/v1/verify-payment";

    const SITE_URL =
      "https://luvoraofficial.github.io";


    // ---------------------------------------
    // Elements
    // ---------------------------------------

    const icon =
      document.getElementById("icon");

    const title =
      document.getElementById("title");

    const message =
      document.getElementById("message");

    const status =
      document.getElementById("status");

    const linkBox =
      document.getElementById("linkBox");

    const surpriseLink =
      document.getElementById("surpriseLink");

    const buttons =
      document.getElementById("buttons");

    const copyBtn =
      document.getElementById("copyBtn");

    const shareBtn =
      document.getElementById("shareBtn");

    const whatsappBtn =
      document.getElementById("whatsappBtn");

    const openBtn =
      document.getElementById("openBtn");

    const smallText =
      document.getElementById("smallText");


    // ---------------------------------------
    // Read URL parameters
    // ---------------------------------------

    const params =
      new URLSearchParams(window.location.search);

    const linkId =
      params.get("link_id");

    const orderId =
      params.get("order_id");


    // ---------------------------------------
    // Verify payment
    // ---------------------------------------

    async function verifyPayment() {

      if (!linkId || !orderId) {

        showError(
          "Payment information is missing.",
          "We could not find the payment details in this link."
        );

        return;
      }


      try {

        const response =
  await fetch(
    VERIFY_PAYMENT_URL,
    {
      method: "POST",

      headers: {
        "Content-Type": "application/json",

        "apikey":
          window.SUPABASE_CONFIG.publishableKey,

        "Authorization":
          `Bearer ${window.SUPABASE_CONFIG.publishableKey}`
      },

      body: JSON.stringify({
        link_id: linkId,
        order_id: orderId
      })
    }
  );


        const data =
          await response.json();


        console.log(
          "Payment verification response:",
          data
        );


        if (!response.ok) {

          showError(
            "Verification failed",
            data.error ||
            "We could not verify your payment."
          );

          return;
        }


        // -----------------------------------
        // PAYMENT VERIFIED
        // -----------------------------------

        if (
          data.verified === true &&
          data.payment_status === "paid"
        ) {

          showSuccess();

          return;
        }


        // -----------------------------------
        // PAYMENT NOT PAID YET
        // -----------------------------------

        showPending(
          data.payment_status
        );

      } catch (error) {

        console.error(
          "Verification error:",
          error
        );

        showError(
          "Something went wrong",
          "Please refresh this page after a few seconds."
        );
      }
    }


    // ---------------------------------------
    // Success
    // ---------------------------------------

    function showSuccess() {

      icon.textContent = "✓";

      title.textContent =
        "Your Surprise is Ready ❤️";

      message.textContent =
        "Payment verified successfully! Your personalized surprise is ready to share.";

      message.className = "";

      status.textContent =
        "✓ Payment Verified";

      status.style.color = "#176b42";

      status.style.background =
        "#e8f6ee";


      // -----------------------------------
      // Create birthday page URL
      // -----------------------------------

      const shareUrl =
        `${SITE_URL}/birthday.html?id=${encodeURIComponent(linkId)}`;


      surpriseLink.value =
        shareUrl;

      openBtn.href =
        shareUrl;


      linkBox.style.display =
        "block";

      buttons.style.display =
        "flex";


      smallText.textContent =
        "Send this link to your loved one and let the surprise begin ❤️";


      // -----------------------------------
      // WhatsApp
      // -----------------------------------

      whatsappBtn.onclick =
        function () {

          const text =
            "I made a special surprise for you ❤️\n\n" +
            "Open it here:\n" +
            shareUrl;

          const whatsappUrl =
            "https://wa.me/?text=" +
            encodeURIComponent(text);

          window.open(
            whatsappUrl,
            "_blank"
          );
        };


      // -----------------------------------
      // Copy
      // -----------------------------------

      copyBtn.onclick =
        async function () {

          try {

            await navigator.clipboard.writeText(
              shareUrl
            );

            copyBtn.textContent =
              "Copied ✓";

            setTimeout(
              () => {
                copyBtn.textContent =
                  "Copy Link";
              },
              2000
            );

          } catch {

            surpriseLink.select();

            document.execCommand(
              "copy"
            );

            copyBtn.textContent =
              "Copied ✓";
          }
        };


      // -----------------------------------
      // Share
      // -----------------------------------

      shareBtn.onclick =
        async function () {

          const shareData = {
            title:
              "A Special Surprise ❤️",

            text:
              "Someone made a special surprise for you ❤️",

            url:
              shareUrl
          };


          if (
            navigator.share
          ) {

            try {

              await navigator.share(
                shareData
              );

            } catch (error) {

              console.log(
                "Share cancelled."
              );
            }

          } else {

            try {

              await navigator.clipboard.writeText(
                shareUrl
              );

              alert(
                "Surprise link copied!"
              );

            } catch {

              alert(
                "Please copy the link manually."
              );
            }
          }
        };
    }


    // ---------------------------------------
    // Pending
    // ---------------------------------------

    function showPending(
      paymentStatus
    ) {

      icon.textContent =
        "⏳";

      title.textContent =
        "Payment is being verified";

      message.textContent =
        "Your payment has not been confirmed yet.";

      message.className =
        "loading";

      status.textContent =
        "Status: " +
        (
          paymentStatus ||
          "Pending"
        );

      smallText.textContent =
        "Please wait a moment and refresh this page.";
    }


    // ---------------------------------------
    // Error
    // ---------------------------------------

    function showError(
      heading,
      text
    ) {

      icon.textContent =
        "!";

      title.textContent =
        heading;

      message.textContent =
        text;

      message.className =
        "error";

      status.textContent =
        "Payment could not be verified";

      status.className =
        "status error";

      smallText.textContent =
        "If money was deducted, please do not pay again immediately. Contact Luvora support.";
    }


    // ---------------------------------------
    // Start
    // ---------------------------------------

    verifyPayment();

  </script>

</body>
</html>
